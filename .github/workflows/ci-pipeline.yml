name: smoke3

on:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.6"
      - run: echo "matrix ok ${{ matrix.python-version }}"
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - run: echo "smoke3 ok"
