# Example review-loop workflow: execution → review → improvement.
#
# The full v0.8 loop: fire due reminders and render the calendar
# (execution), aggregate the deterministic Decision Engine queries
# (plan-review), then ask the LLM for concrete improvement suggestions
# (plan-improve). plan-improve is offline-safe: with AI disabled or the
# backend unreachable it returns the deterministic review unchanged and
# the workflow still succeeds.
#
# Copy to ~/.growth/workflows/ and run:
#   growth workflow run review-loop            # or: --dry-run
name: review-loop
trigger: time
steps:
  - reminder-sweep
  - export-ics
  - plan-review
  - plan-improve
  - next-action
  - priority-sort
